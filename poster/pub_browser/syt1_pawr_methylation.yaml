# poster/pub_browser/syt1_pawr_methylation.yaml
# Syt1/Pawr locus: H2AK119ub, 5mC, 5hmC (4 reps averaged, sparse), RNA-seq
# Run: Rscript poster/pub_browser/pub_browser.R --config poster/pub_browser/syt1_pawr_methylation.yaml

genome: mm10
region: 'chr10:108280000-109060000'
gene_symbol: Syt1
focal_genes: [Syt1, Pawr]

labels:
  - 'control'
  - 'Bap1 f/f, Math1-cre'
genotype_italic: true

output: poster/pub_browser/output/syt1_pawr_methylation
scale_bar_kb: 100
width: 10
track_height: 0.36

marks:
  - name: 'H2AK119ub'
    color: '#2171B5'
    ctrl: /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/H2AK119ubCtrl.bw
    mut:  /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/H2AK119ubMut.bw
    average: true

  - name: '5mC'
    color: '#E41A1C'
    sparse: true
    diff: true
    ctrl:
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-ctrl-F.genome.mc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-ctrl-M.genome.mc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-ctrl-F-B2.genome.mc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-ctrl-M-B2.genome.mc_bedgraph.bw
    mut:
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-mut-F.genome.mc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-mut-M.genome.mc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-mut-F-B2.genome.mc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/mc/evoC-Bap1-mut-M-B2.genome.mc_bedgraph.bw
    average: true

  - name: '5hmC'
    color: '#4DAF4A'
    sparse: true
    diff: true
    ctrl:
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-ctrl-F.genome.hmc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-ctrl-M.genome.hmc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-ctrl-F-B2.genome.hmc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-ctrl-M-B2.genome.hmc_bedgraph.bw
    mut:
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-mut-F.genome.hmc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-mut-M.genome.hmc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-mut-F-B2.genome.hmc_bedgraph.bw
      - /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/methylation/hmc/evoC-Bap1-mut-M-B2.genome.hmc_bedgraph.bw
    average: true

  - name: 'RNA-seq'
    color: '#8856A7'
    diff: true
    ctrl: /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/RNActrl.bw
    mut:  /expanse/lustre/projects/csd940/zalibhai/sdsc/bigwigs/RNAmut.bw
    average: true
