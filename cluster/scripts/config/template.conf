# cluster/scripts/config/template.conf
# Template configuration for a new project using the Hi-C loop clustering pipeline.
#
# INSTRUCTIONS:
#   1. Copy this file: cp template.conf myproject.conf
#   2. Fill in all required values (marked REQUIRED)
#   3. Source before running:  CLUSTER_CONF=scripts/config/myproject.conf bash scripts/run_phase1.sh
#   4. After inspecting Phase 3 clustering results, fill in the biological annotation
#      section at the bottom (optional but recommended for publication-quality figures).
#
# All paths are relative to REPO_ROOT (the parent of cluster/) unless marked absolute.

# ============================================================================
# REQUIRED — Timepoint / experiment identity
# ============================================================================
CLUSTER_TIMEPOINT_LABEL=""       # e.g. "late", "adult", "treated_24h"
CLUSTER_TIMEPOINT_ID=""          # e.g. "250402", "exp001"
CLUSTER_OUT_DIR=""               # e.g. "outputs/my_experiment" — where cluster outputs go
CLUSTER_CELL_NAME=""             # e.g. "cerebellum_late", "RPE1_dTAG" — used as ChromHMM cell label

# ============================================================================
# REQUIRED — Experimental design
# ============================================================================
# Replicate column names as they appear in the per-resolution count matrices.
# Comma-separated, no spaces. Must match headers in 06_counts_matrix.tsv.
CLUSTER_CTRL_REPS=""             # e.g. "DMSO_R1,DMSO_R2,DMSO_R3"
CLUSTER_MUT_REPS=""              # e.g. "Drug_R1,Drug_R2,Drug_R3,Drug_R4"

# Output condition column names (the two averaged-replicate columns in the count file).
# Downstream code does cond_col.replace('_merge','') for display labels.
CLUSTER_COND1_COL=""             # e.g. "DMSO_merge"  (control / reference condition)
CLUSTER_COND2_COL=""             # e.g. "Drug_merge"  (perturbation / test condition)

# Resolutions available in the loop call data (kb, comma-separated).
CLUSTER_RESOLUTIONS=""           # e.g. "5,10,25"

# ============================================================================
# REQUIRED — Phase 1: Input data paths (relative to REPO_ROOT)
# ============================================================================
CLUSTER_MERGED_BEDPE=""          # e.g. "outputs/exp001-late_outputs/bedpe_final/merged_all_loops_nonredundant.bedpe"
CLUSTER_COUNTS_TEMPLATE=""       # e.g. "outputs/exp001-late_outputs/res_{kb}kb/06_counts_matrix.tsv"
                                 # Use {kb} as placeholder for resolution value.
CLUSTER_EDGER_TEMPLATE=""        # e.g. "outputs/exp001-late_outputs/edgeR_results_res_{kb}kb/primary_analysis/all_results_primary.tsv"

# ============================================================================
# REQUIRED — Phase 2: ChIP-seq peak BEDs for ChromHMM (relative to REPO_ROOT)
# ============================================================================
# Provide wildtype/control peak BEDs for each histone mark. ChromHMM learns
# chromatin states from these. Minimum 3 marks; more marks = finer resolution.
CLUSTER_PEAK_K27AC=""            # e.g. "peaks/beds/H3K27ac_sample.bed"
CLUSTER_PEAK_K27ME3=""           # e.g. "peaks/beds/H3K27me3_sample.bed"
CLUSTER_PEAK_K4ME1=""            # e.g. "peaks/beds/H3K4me1_sample.bed"
CLUSTER_PEAK_K4ME3=""            # e.g. "peaks/beds/H3K4me3_sample.bed"
CLUSTER_PEAK_CTCF=""             # e.g. "peaks/CTCF.bed"

# ============================================================================
# REQUIRED — Phase 4: Annotation BEDs
# ============================================================================
CLUSTER_ENHANCER_BED=""          # e.g. "peaks/beds/H3K27ac_sample.bed" (same as K27AC peaks, or an enhancer-specific set)

# ============================================================================
# REQUIRED — Machine-specific paths (absolute)
# ============================================================================
# BigWig directory containing all ChIP-seq signal tracks.
# Individual filenames can be overridden via CLUSTER_BW_<KEY> env vars.
CLUSTER_BIGWIG_DIR=""            # e.g. "/data/bigwigs"

# Binaries — set to match your system, or leave empty to use PATH lookup.
# CLUSTER_PYTHON=""              # e.g. "/path/to/conda/envs/cluster/bin/python3"
# CLUSTER_RSCRIPT=""             # e.g. "/usr/bin/Rscript"
CLUSTER_BIN=""                   # e.g. "/usr/local/bin/cluster" — Cluster 3.0 binary

# ============================================================================
# OPTIONAL — Clustering parameters (sensible defaults provided)
# ============================================================================
CLUSTER_K=6                      # Number of k-means clusters. Inspect elbow plot first.
CLUSTER_FILTER_PCT=0.01          # Per-resolution percentile filter (remove low-count loops)
CLUSTER_MIN_RATIO=0.333          # Minimum mut/ctrl ratio bound (removes outliers)
CLUSTER_MAX_RATIO=3.0            # Maximum mut/ctrl ratio bound

# ============================================================================
# OPTIONAL — BigWig filename overrides
# ============================================================================
# By default, build_bigwig_dict() expects files named like H3K27acCtrl.bw.
# Override individual filenames if yours differ:
# CLUSTER_BW_H3K27AC_CTRL="my_K27ac_ctrl.bw"
# CLUSTER_BW_H3K27AC_MUT="my_K27ac_mut.bw"
# CLUSTER_BW_H3K27ME3_CTRL="my_K27me3_ctrl.bw"
# CLUSTER_BW_H3K27ME3_MUT="my_K27me3_mut.bw"
# CLUSTER_BW_H2AK119UB_CTRL="my_K119ub_ctrl.bw"
# CLUSTER_BW_H2AK119UB_MUT="my_K119ub_mut.bw"
# CLUSTER_BW_H3K27ME1_CTRL="my_K27me1_ctrl.bw"
# CLUSTER_BW_H3K27ME1_MUT="my_K27me1_mut.bw"

# Mark-to-colormap mapping (comma-separated mark=cmap pairs):
# CLUSTER_MARK_COLORS="H3K27ac=Blues,H3K27me3=Reds,H2AK119ub=Greens,H3K27me1=Purples"

# ============================================================================
# OPTIONAL — Phase 6: mcool files (HPC only)
# ============================================================================
# CLUSTER_MCOOL_CTRL=""          # e.g. "/path/to/ctrl_merged.mcool"
# CLUSTER_MCOOL_MUT=""           # e.g. "/path/to/mut_merged.mcool"

# ============================================================================
# OPTIONAL — Validation (omit to skip count assertions)
# ============================================================================
# CLUSTER_EXPECTED_TOTAL=        # Expected total merged loops (integer)
# CLUSTER_EXPECTED_PER_RES=      # Per-resolution expected counts: "5=7901,10=14553,25=16890"

# ============================================================================
# OPTIONAL — Subgroup analysis
# ============================================================================
# CLUSTER_SIZE_THRESHOLD=800000  # Loop size (bp) for short/long subgroup split

# ============================================================================
# OPTIONAL — Biological annotation (fill in AFTER inspecting clustering results)
# ============================================================================
# Biological display ordering (comma-separated cluster IDs, loss -> gain):
# CLUSTER_BIO_ORDER="clust6,clust3,clust1,clust2,clust4,clust5"

# ChromHMM state IDs for the "key" states highlighted in summary figures:
# CLUSTER_KEY_STATE_ID="11_Polycomb"
# CLUSTER_KEY_STATE2_ID="12_Bivalent_Enhancer"

# Per-cluster interpretive labels (use \n for line breaks in figure text):
# CLUSTER_BIO_NAME_clust1="Unchanged\n(high signal)"
# CLUSTER_BIO_NAME_clust2="Unchanged"
# ...

# Per-cluster direction labels:
# CLUSTER_DIRECTION_clust1="unchanged"
# CLUSTER_DIRECTION_clust2="~unchanged"
# ...

# Condition display colors:
# CLUSTER_COND1_COLOR="darkgrey"
# CLUSTER_COND2_COLOR="forestgreen"

# ============================================================================
# OPTIONAL — Phase control
# ============================================================================
CLUSTER_SKIP_PHASES=""
# Example: skip deepTools + cooltools on a machine without BigWigs/mcools:
# CLUSTER_SKIP_PHASES="5 6 8"
