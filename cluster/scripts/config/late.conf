# cluster/scripts/config/late.conf
# Pipeline configuration for the LATE / ADULT timepoint (250402)
# Source this file before running the pipeline.
# All paths are relative to REPO_ROOT unless marked absolute.

# --- Timepoint identity ---
CLUSTER_TIMEPOINT_LABEL="late"
CLUSTER_TIMEPOINT_ID="250402"
CLUSTER_OUT_DIR="outputs/bap1_late"
CLUSTER_CELL_NAME="cerebellum_late"

# --- Clustering parameters ---
CLUSTER_K=6
CLUSTER_FILTER_PCT=0.01
CLUSTER_MIN_RATIO=0.333
CLUSTER_MAX_RATIO=3.0

# --- Phase 1: Input data paths (relative to REPO_ROOT) ---
CLUSTER_MERGED_BEDPE="outputs/250402-late_outputs/bedpe_final/merged_all_loops_nonredundant.bedpe"
CLUSTER_COUNTS_TEMPLATE="outputs/250402-late_outputs/res_{kb}kb/06_counts_matrix.tsv"
CLUSTER_EDGER_TEMPLATE="outputs/250402-late_outputs/edgeR_results_res_{kb}kb/primary_analysis/all_results_primary.tsv"

# --- Phase 2: ChIP-seq peak BEDs for ChromHMM (relative to REPO_ROOT) ---
CLUSTER_PEAK_K27AC="peaks/beds/H3K27acCerebellumLate2.bed"
CLUSTER_PEAK_K27ME3="peaks/beds/H3K27me3CerebellumLate1.bed"
CLUSTER_PEAK_K4ME1="peaks/beds/H3K4me1CerebellumLate1.bed"
CLUSTER_PEAK_K4ME3="peaks/beds/H3K4me3CerebellumLate2.bed"
CLUSTER_PEAK_CTCF="peaks/CTCF.bed"

# --- Phase 4: Annotation BEDs (relative to REPO_ROOT) ---
CLUSTER_ENHANCER_BED="peaks/beds/H3K27acCerebellumLate2.bed"

# --- BigWig directory (absolute — machine-specific) ---
# Mac:
CLUSTER_BIGWIG_DIR="/Users/zakiralibhai/sdsc/bigwigs"
# HPC (uncomment and comment the Mac line):
# CLUSTER_BIGWIG_DIR="/expanse/lustre/projects/csd940/zalibhai/bigwigs"

# --- Phase 6: mcool files (absolute — HPC only) ---
CLUSTER_MCOOL_CTRL="/expanse/lustre/projects/csd940/zalibhai/stripes/stripenn/data/cool/250402/ctrl_merged.mcool"
CLUSTER_MCOOL_MUT="/expanse/lustre/projects/csd940/zalibhai/stripes/stripenn/data/cool/250402/mut_merged.mcool"

# --- Binaries (absolute — machine-specific) ---
# Mac:
CLUSTER_BIN="/usr/local/bin/cluster"
# HPC (adjust if installed elsewhere):
# CLUSTER_BIN="${HOME}/apps/cluster-1.59/src/cluster"

# --- Phases to run (space-separated, or "all") ---
# Skip phases with CLUSTER_SKIP_PHASES (space-separated phase numbers)
CLUSTER_SKIP_PHASES=""
# Example: skip deepTools + cooltools on a machine without BigWigs/mcools:
# CLUSTER_SKIP_PHASES="5 6 8"
