# cluster/scripts/config/early.conf
# Pipeline configuration for the EARLY / P12 timepoint (250831)
# Source this file before running the pipeline.
# All paths are relative to REPO_ROOT unless marked absolute.

# --- Timepoint identity ---
CLUSTER_TIMEPOINT_LABEL="early"
CLUSTER_TIMEPOINT_ID="250831"
CLUSTER_OUT_DIR="outputs/bap1_early"
CLUSTER_CELL_NAME="cerebellum_early"

# --- Clustering parameters ---
# NOTE: early timepoint has ~361 differential loops. k=6 may produce
# very small or empty clusters. Consider k=3 or k=4 and inspect the
# elbow plot before committing. Ratio bounds may also need adjustment
# if the early data has different outlier characteristics.
CLUSTER_K=4
CLUSTER_FILTER_PCT=0.01
CLUSTER_MIN_RATIO=0.333
CLUSTER_MAX_RATIO=3.0

# --- Phase 1: Input data paths (relative to REPO_ROOT) ---
CLUSTER_MERGED_BEDPE="outputs/250831-early_outputs/bedpe_final/merged_all_loops_nonredundant.bedpe"
CLUSTER_COUNTS_TEMPLATE="outputs/250831-early_outputs/res_{kb}kb/06_counts_matrix.tsv"
CLUSTER_EDGER_TEMPLATE="outputs/250831-early_outputs/edgeR_results_res_{kb}kb/primary_analysis/all_results_primary.tsv"

# --- Phase 2: ChIP-seq peak BEDs for ChromHMM (relative to REPO_ROOT) ---
CLUSTER_PEAK_K27AC="peaks/beds/H3K27acCerebellumEarly2.bed"
CLUSTER_PEAK_K27ME3="peaks/beds/H3K27me3CerebellumEarly1.bed"
CLUSTER_PEAK_K4ME1="peaks/beds/H3K4me1CerebellumEarly1.bed"
CLUSTER_PEAK_K4ME3="peaks/beds/H3K4me3CerebellumEarly2.bed"
CLUSTER_PEAK_CTCF="peaks/CTCF.bed"

# --- Phase 4: Annotation BEDs (relative to REPO_ROOT) ---
CLUSTER_ENHANCER_BED="peaks/beds/H3K27acCerebellumEarly2.bed"

# --- BigWig directory (absolute — machine-specific) ---
# Mac:
CLUSTER_BIGWIG_DIR="/Users/zakiralibhai/sdsc/bigwigs"
# HPC (uncomment and comment the Mac line):
# CLUSTER_BIGWIG_DIR="/expanse/lustre/projects/csd940/zalibhai/bigwigs"

# --- Phase 6: mcool files (absolute — HPC only) ---
CLUSTER_MCOOL_CTRL="/expanse/lustre/projects/csd940/zalibhai/stripes/stripenn/data/cool/250831/ctrl_merged.mcool"
CLUSTER_MCOOL_MUT="/expanse/lustre/projects/csd940/zalibhai/stripes/stripenn/data/cool/250831/mut_merged.mcool"

# --- Binaries (absolute — machine-specific) ---
CLUSTER_BIN="/usr/local/bin/cluster"
# CLUSTER_BIN="${HOME}/apps/cluster-1.59/src/cluster"

# --- Experimental design ---
CLUSTER_CTRL_REPS="ctrl_M1,ctrl_M2,ctrl_M3"
CLUSTER_MUT_REPS="mut_M1,mut_M2,mut_M3"
CLUSTER_COND1_COL="ctrl_merge"
CLUSTER_COND2_COL="mut_merge"
CLUSTER_RESOLUTIONS="5,10,25"
# No expected-count validation for early — loop counts not yet established
# CLUSTER_EXPECTED_TOTAL=
# CLUSTER_EXPECTED_PER_RES=

# --- Machine-specific binaries ---
CLUSTER_PYTHON="/opt/homebrew/anaconda3/envs/cluster/bin/python3"
CLUSTER_RSCRIPT="/usr/local/bin/Rscript"

# --- Biological annotation ---
# Fill in AFTER inspecting early-timepoint clustering results.
# CLUSTER_BIO_ORDER=
# CLUSTER_KEY_STATE_ID="11_Polycomb"
# CLUSTER_BIO_NAME_clust1=
# CLUSTER_BIO_NAME_clust2=
# CLUSTER_BIO_NAME_clust3=
# CLUSTER_BIO_NAME_clust4=

# --- Phases to run ---
# Early timepoint has very few differential loops (~361). Consider
# running Phases 1-4 first, inspecting the elbow plot and cluster
# sizes, then deciding whether Phases 5-8 are worth the compute.
CLUSTER_SKIP_PHASES=""
# CLUSTER_SKIP_PHASES="5 6 8"
