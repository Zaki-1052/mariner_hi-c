# stripes/config/stripe_config.yaml
# Configuration for Differential Chromatin Stripe Analysis Pipeline
# BAP1-KO vs Wildtype Comparison - Mouse Cerebellum (mm10)
# Designed to run on SDSC Expanse HPC

# ==============================================================================
# Project Settings
# ==============================================================================
project:
  name: "Differential Stripe Analysis"
  version: "1.0.0"
  base_dir: "/expanse/lustre/projects/csd940/zalibhai/stripes"

# ==============================================================================
# Stripe Data Paths (BEDPE files from Quagga)
# ==============================================================================
stripe_data:
  # Base path to stripe BEDPE files
  # Structure: {base_path}/{resolution}kb/{timepoint}/{sample}_stripes.bedpe
  base_path: "/expanse/lustre/projects/csd940/zalibhai/stripes/stripe-data"

  # Timepoint directory names
  timepoints:
    early: "250831"
    late: "250402"

  # Resolutions available (in bp)
  resolutions:
    primary: 5000      # 5kb - primary analysis resolution
    validation: 10000  # 10kb - for confidence annotation only

# ==============================================================================
# Hi-C Files (for Phase 2 quantification)
# ==============================================================================
hic_files:
  # Base path to .hic files
  # Structure: {base_path}/{timepoint}/{sample}.hic
  base_path: "/expanse/lustre/projects/csd940/zalibhai/stripes/StripeCaller/data/hic"

# ==============================================================================
# Sample Information
# ==============================================================================
samples:
  names: ["ctrl_M1", "ctrl_M2", "ctrl_M3", "mut_M1", "mut_M2", "mut_M3"]
  groups: ["ctrl", "ctrl", "ctrl", "mut", "mut", "mut"]
  replicates: ["M1", "M2", "M3"]
  conditions:
    ctrl: "Wildtype control"
    mut: "BAP1-KO mutant"

# ==============================================================================
# Phase 1: Detection Parameters
# ==============================================================================
detection:
  # Anchor matching tolerance (bp)
  # Stripes with anchors overlapping within this distance are considered "same stripe"
  anchor_tolerance_bp: 50000  # 50kb

  # Minimum stripe length (already filtered at Quagga level)
  min_stripe_length: 200000   # 200kb

  # Confidence scoring thresholds
  confidence:
    # High confidence: detected in >= 2 replicates AND validated at 10kb
    high_min_reps: 2
    # Medium confidence: detected in >= 1 replicate OR in_10kb OR pval < threshold
    medium_min_reps: 1
    high_pval_threshold: 1e-10  # Very significant detection

# ==============================================================================
# Phase 2: Quantification Parameters
# ==============================================================================
quantification:
  # Sampling distance into span direction (from anchor center)
  # This defines where to extract Hi-C signal for quantification
  sampling_distance_bp: 100000  # 100kb into span

  # Buffer size for matrix extraction
  # buffer=2 means ±2 bins around center = 5x5 pixel matrix
  buffer_bins: 2

  # Hi-C normalization method
  normalization: "KR"     # Knight-Ruiz preferred
  fallback_norm: "VC"     # Vanilla Coverage fallback if KR unavailable

  # HDF5 settings for out-of-memory processing
  on_disk: true
  block_size: 1000000     # 1Mb blocks for memory efficiency
  compression_level: 1

# ==============================================================================
# Phase 3: edgeR Parameters
# ==============================================================================
edger:
  # Skip filtering due to small feature set (~150-300 stripes)
  skip_filtering: true
  min_count: 0            # Keep all stripes

  # Normalization method
  normalization_method: "TMM"

  # GLM settings
  robust_dispersion: true

  # Significance thresholds
  fdr_primary: 0.05       # Primary FDR threshold
  fdr_exploratory: 0.10   # Exploratory/relaxed threshold

# ==============================================================================
# Phase 4: Classification Parameters
# ==============================================================================
classification:
  # logFC threshold for strengthened/weakened classification (shared stripes)
  logFC_threshold: 0.3

  # FDR threshold for shared stripe classification (strengthened/weakened)
  fdr_threshold: 0.05

  # Tiered confidence thresholds for condition-specific stripes
  # (lost/gained now use detection as primary evidence)
  tiered:
    high_fdr: 0.10           # FDR threshold for high confidence tier
    medium_logfc: 0.2        # logFC threshold for medium confidence tier
    # Low confidence = detection only (no additional threshold)

  # Updated classification logic (tiered):
  # LOST (control_only stripes):
  #   - High: FDR < 0.10 AND logFC < 0 (quantitative support)
  #   - Medium: logFC < -0.2 (directional support)
  #   - Low: detection only (may not have quantitative support)
  #
  # GAINED (mutant_only stripes):
  #   - High: FDR < 0.10 AND logFC > 0 (quantitative support)
  #   - Medium: logFC > 0.2 (directional support)
  #   - Low: detection only (may not have quantitative support)
  #
  # SHARED stripes (unchanged from original):
  #   - strengthened: FDR < 0.05 AND logFC > 0.3
  #   - weakened: FDR < 0.05 AND logFC < -0.3
  #   - unchanged: doesn't meet above criteria

# ==============================================================================
# Output Settings
# ==============================================================================
outputs:
  # Output file formats
  formats: ["tsv", "rds", "bedpe"]

  # Output directory (on Expanse)
  base_dir: "/expanse/lustre/projects/csd940/zalibhai/stripes/outputs"

  # Subdirectory structure:
  # {base_dir}/{timepoint}/              - All phase outputs
  # {base_dir}/{timepoint}/edgeR_results/ - Phase 3 plots and objects

# ==============================================================================
# Runtime Settings
# ==============================================================================
runtime:
  seed: 42
  verbose: true
  parallel_cores: 12  # Match SLURM allocation

# ==============================================================================
# Chromosome Filtering
# ==============================================================================
filtering:
  # Exclude sex chromosomes and unplaced contigs
  exclude_chromosomes: ["chrX", "chrY", "chrM"]

# ==============================================================================
# ChIP-seq Peak Files (for anchor annotation)
# ==============================================================================
chipseq_peaks:
  # Early timepoint (P12)
  h3k27ac_early: "/expanse/lustre/projects/csd940/zalibhai/mariner_hi-c/peaks/P12_ctrl_H3K27ac_early_peaks.bed"
  h3k27me3_early: "/expanse/lustre/projects/csd940/zalibhai/mariner_hi-c/peaks/P12_ctrl_H3K27me3_early_peaks.bed"
  # Late timepoint
  h3k27ac_late: "/expanse/lustre/projects/csd940/zalibhai/mariner_hi-c/peaks/220310index25H3K27acLatePeakRegions.bed"
  h3k4me1_late: "/expanse/lustre/projects/csd940/zalibhai/mariner_hi-c/peaks/K4me1_aligned_reads_peaks.broadPeak-filtered.bed"

# ==============================================================================
# SLURM Settings (for reference)
# ==============================================================================
slurm:
  partition: "shared"
  nodes: 1
  cpus_per_task: 12
  memory: "64G"
  time: "24:00:00"
  account: "csd940"
